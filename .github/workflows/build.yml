name: Build Firmware

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install AVR toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr avr-libc binutils-avr

      - name: Install QMK CLI and dependencies
        run: |
          pip3 install qmk
          qmk setup -y -H "$GITHUB_WORKSPACE"

      - name: Build left side (trackpad)
        run: |
          make holykeebs/spankbd:via \
            -e USER_NAME=holykeebs \
            -e POINTING_DEVICE=cirque35_trackpoint \
            -e SIDE=left \
            -j4

      - name: Rename left firmware
        run: mv holykeebs_spankbd_via.uf2 holykeebs_spankbd_via_left.uf2

      - name: Build right side (trackpoint)
        run: |
          make holykeebs/spankbd:via \
            -e USER_NAME=holykeebs \
            -e POINTING_DEVICE=cirque35_trackpoint \
            -e SIDE=right \
            -j4

      - name: Rename right firmware
        run: mv holykeebs_spankbd_via.uf2 holykeebs_spankbd_via_right.uf2

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spankbd-firmware
          path: |
            holykeebs_spankbd_via_left.uf2
            holykeebs_spankbd_via_right.uf2
          retention-days: 30
